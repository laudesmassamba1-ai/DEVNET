<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11100D"/>
      <stop offset="100%" stop-color="#0A0907"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="210" r="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9A40" stop-opacity="0.24"/>
      <stop offset="70%" stop-color="#FF7C33" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FF7C33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFill" x1="256" y1="110" x2="256" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB066"/>
      <stop offset="60%" stop-color="#FF7C33"/>
      <stop offset="100%" stop-color="#D96A2B"/>
    </linearGradient>
    <linearGradient id="midFill" x1="140" y1="210" x2="372" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9140"/>
      <stop offset="100%" stop-color="#C85F24"/>
    </linearGradient>
    <linearGradient id="botFill" x1="256" y1="302" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFA355"/>
      <stop offset="60%" stop-color="#FF7C33"/>
      <stop offset="100%" stop-color="#B55622"/>
    </linearGradient>
    <linearGradient id="leftFill" x1="140" y1="110" x2="172" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB066"/>
      <stop offset="55%" stop-color="#FF7C33"/>
      <stop offset="100%" stop-color="#A64C1F"/>
    </linearGradient>
    <linearGradient id="rightFill" x1="372" y1="110" x2="340" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB066"/>
      <stop offset="55%" stop-color="#FF7C33"/>
      <stop offset="100%" stop-color="#A64C1F"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF3D6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFF3D6" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#FFF3D6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFF3D6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mask">
      <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 V 302 L 372 362 V 402 H 322 L 292 342 H 220 L 190 402 H 140 V 362 L 172 302 V 210 L 140 150 Z"/>
    </clipPath>
    <filter id="drop" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <style>
      @keyframes glowPulse { 0%,100%{opacity:.26;transform:scale(1)} 50%{opacity:.42;transform:scale(1.016)} }
      @keyframes floatCore { 0%,100%{transform:translateY(0) rotate(0deg) scale(1)} 25%{transform:translateY(-2%) rotate(0.12deg) scale(1.0022)} 50%{transform:translateY(-1.2%) rotate(-0.08deg) scale(1.0018)} 75%{transform:translateY(-2.2%) rotate(0.1deg) scale(1.0024)} }
      @keyframes sweepAnim { 0%{transform:translateX(-250%)} 30%{transform:translateX(250%)} 100%{transform:translateX(250%)} }
      @keyframes flow { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-84} }
      @keyframes nodeA { 0%,100%{r:6.4;opacity:.96;transform:scale(1)} 40%{r:8.2;opacity:1;transform:scale(1.18);filter:drop-shadow(0 0 12px rgba(255,246,224,.7))} 60%{r:7.6;opacity:1;transform:scale(1.08)} }
      @keyframes nodeB { 0%,100%{r:8;opacity:.98;transform:scale(1)} 40%{r:10.2;opacity:1;transform:scale(1.22);filter:drop-shadow(0 0 14px rgba(255,246,224,.78))} 60%{r:9.4;opacity:1;transform:scale(1.1)} }
      @keyframes nodeC { 0%,100%{r:6.4;opacity:.96;transform:scale(1)} 40%{r:8.2;opacity:1;transform:scale(1.18);filter:drop-shadow(0 0 12px rgba(255,246,224,.7))} 60%{r:7.6;opacity:1;transform:scale(1.08)} }
      @keyframes aura { 0%,100%{opacity:.12;transform:scale(.92)} 50%{opacity:.24;transform:scale(1.08)} }
      .glo { animation:glowPulse 3.8s ease-in-out infinite; transform-origin:256px 210px; }
      .core { animation:floatCore 5.2s ease-in-out infinite; transform-origin:256px 256px; will-change:transform; }
      .swp { animation:sweepAnim 5s cubic-bezier(.25,.8,.25,1) infinite; will-change:transform; }
      .flw { stroke-dasharray:14 14; animation:flow 5s linear infinite; }
      .na,.nb,.nc { transform-origin:center; }
      .na { animation:nodeA 3.2s ease-in-out infinite; }
      .nb { animation:nodeB 3.6s ease-in-out infinite; }
      .nc { animation:nodeC 3s ease-in-out infinite; }
      .au { animation:aura 3.4s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>
  <circle cx="256" cy="210" r="215" fill="url(#glow)" class="glo"/>
  <g class="core" filter="url(#drop)">
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 V 302 L 372 362 V 402 H 322 L 292 342 H 220 L 190 402 H 140 V 362 L 172 302 V 210 L 140 150 Z" fill="#15120D"/>
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 V 302 L 372 362 V 402 H 322 L 292 342 H 220 L 190 402 H 140 V 362 L 172 302 V 210 L 140 150 Z" fill="url(#midFill)" opacity=".98"/>
    <path d="M 148 118 H 184 L 214 178 H 298 L 328 118 H 364 V 146 L 332 206 V 306 L 364 366 V 394 H 328 L 298 334 H 214 L 184 394 H 148 V 366 L 180 306 V 206 L 148 146 Z" fill="#000000" opacity=".18"/>
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 H 172 L 140 150 Z" fill="url(#topFill)"/>
    <path d="M 140 402 H 190 L 220 342 H 292 L 322 402 H 372 V 362 L 340 302 H 172 L 140 362 Z" fill="url(#botFill)"/>
    <path d="M 140 110 V 150 L 172 210 V 302 L 140 362 V 402" fill="url(#leftFill)"/>
    <path d="M 372 110 V 150 L 340 210 V 302 L 372 362 V 402" fill="url(#rightFill)"/>
    <g clip-path="url(#mask)">
      <rect x="-250" y="70" width="250" height="372" fill="url(#sweep)" class="swp" opacity=".62"/>
    </g>
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 M 140 402 H 190 L 220 342 H 292 L 322 402 H 372 M 140 150 L 172 210 M 340 210 L 372 150 M 172 302 L 140 362 M 372 362 L 340 302 M 172 210 V 302 M 340 210 V 302 M 220 170 V 342 M 292 170 V 342" stroke="#1B150F" stroke-opacity=".52" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 145 115 H 187 L 217 175 H 295 L 325 115 H 367 M 145 397 H 187 L 217 337 H 295 L 325 397 H 367" stroke="#FFE7BE" stroke-opacity=".26" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 172 210 H 340 M 172 302 H 340 M 220 170 V 342 M 292 170 V 342" stroke="#FFE9C4" stroke-opacity=".22" stroke-width="2.8" stroke-linecap="round" fill="none" class="flw"/>
    <circle cx="256" cy="176" r="6.4" fill="#FFF1D6" class="na"/>
    <circle cx="256" cy="256" r="8" fill="#FFF6E0" class="nb"/>
    <circle cx="256" cy="336" r="6.4" fill="#FFF1D6" class="nc"/>
    <circle cx="256" cy="176" r="12" fill="#FFF6E0" opacity=".16" class="au"/>
    <circle cx="256" cy="256" r="15.5" fill="#FFF6E0" opacity=".18" class="au" style="animation-delay:.4s"/>
    <circle cx="256" cy="336" r="12" fill="#FFF6E0" opacity=".16" class="au" style="animation-delay:.8s"/>
  </g>
</svg>
