<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="glowW" cx="256" cy="210" r="215" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topW" x1="256" y1="110" x2="256" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    <linearGradient id="midW" x1="140" y1="210" x2="372" y2="302" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F2F2F2"/>
      <stop offset="100%" stop-color="#EDEDED"/>
    </linearGradient>
    <linearGradient id="botW" x1="256" y1="302" x2="256" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F0"/>
    </linearGradient>
    <linearGradient id="sweepW" x1="0" y1="0" x2="190" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="mask">
      <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 V 302 L 372 362 V 402 H 322 L 292 342 H 220 L 190 402 H 140 V 362 L 172 302 V 210 L 140 150 Z"/>
    </clipPath>
    <filter id="dropW" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <style>
      @keyframes glowPulse { 0%,100%{opacity:.20;transform:scale(1)} 50%{opacity:.30;transform:scale(1.012)} }
      @keyframes floatCore { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-1.6%) scale(1.0018)} }
      @keyframes sweepAnim { 0%{transform:translateX(-190%)} 70%{transform:translateX(190%)} 100%{transform:translateX(190%)} }
      @keyframes flow { 0%{stroke-dashoffset:0} 100%{stroke-dashoffset:-56} }
      @keyframes nodeA { 0%,100%{r:6.2;opacity:.98} 50%{r:7.6;opacity:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.65))} }
      @keyframes nodeB { 0%,100%{r:7.8;opacity:1} 50%{r:9.4;opacity:1;filter:drop-shadow(0 0 10px rgba(255,255,255,.7))} }
      @keyframes nodeC { 0%,100%{r:6.2;opacity:.98} 50%{r:7.6;opacity:1;filter:drop-shadow(0 0 8px rgba(255,255,255,.65))} }
      .glo { animation:glowPulse 3.6s ease-in-out infinite; transform-origin:256px 210px; }
      .core { animation:floatCore 4.6s ease-in-out infinite; transform-origin:256px 256px; }
      .swp { animation:sweepAnim 4.2s cubic-bezier(.25,.8,.25,1) infinite; will-change:transform; }
      .flw { stroke-dasharray:14 14; animation:flow 4s linear infinite; }
      .na,.nb,.nc { fill:#FFFFFF }
      .na { animation:nodeA 2.8s ease-in-out infinite; }
      .nb { animation:nodeB 3s ease-in-out infinite; }
      .nc { animation:nodeC 2.6s ease-in-out infinite; }
    </style>
  </defs>
  <circle cx="256" cy="210" r="215" fill="url(#glowW)" class="glo"/>
  <g class="core" filter="url(#dropW)">
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 V 302 L 372 362 V 402 H 322 L 292 342 H 220 L 190 402 H 140 V 362 L 172 302 V 210 L 140 150 Z" fill="#FFFFFF" opacity=".98"/>
    <path d="M 148 118 H 184 L 214 178 H 298 L 328 118 H 364 V 146 L 332 206 V 306 L 364 366 V 394 H 328 L 298 334 H 214 L 184 394 H 148 V 366 L 180 306 V 206 L 148 146 Z" fill="#000000" opacity=".08"/>
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 V 150 L 340 210 H 172 L 140 150 Z" fill="url(#topW)"/>
    <path d="M 140 402 H 190 L 220 342 H 292 L 322 402 H 372 V 362 L 340 302 H 172 L 140 362 Z" fill="url(#botW)"/>
    <path d="M 140 110 V 150 L 172 210 V 302 L 140 362 V 402" fill="#F5F5F5"/>
    <path d="M 372 110 V 150 L 340 210 V 302 L 372 362 V 402" fill="#F5F5F5"/>
    <path d="M 172 210 V 302 H 340 V 210 Z" fill="url(#midW)"/>
    <g clip-path="url(#mask)">
      <rect x="-190" y="80" width="190" height="352" fill="url(#sweepW)" class="swp" opacity=".65"/>
    </g>
    <path d="M 140 110 H 190 L 220 170 H 292 L 322 110 H 372 M 140 402 H 190 L 220 342 H 292 L 322 402 H 372 M 140 150 L 172 210 M 340 210 L 372 150 M 172 302 L 140 362 M 372 362 L 340 302 M 172 210 V 302 M 340 210 V 302 M 220 170 V 342 M 292 170 V 342" stroke="#1A1A1A" stroke-opacity=".16" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M 145 115 H 187 L 217 175 H 295 L 325 115 H 367 M 145 397 H 187 L 217 337 H 295 L 325 397 H 367" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 172 210 H 340 M 172 302 H 340 M 220 170 V 342 M 292 170 V 342" stroke="#FFFFFF" stroke-opacity=".42" stroke-width="2.8" stroke-linecap="round" fill="none" class="flw"/>
    <circle cx="256" cy="176" r="6.2" class="na"/>
    <circle cx="256" cy="256" r="7.8" class="nb"/>
    <circle cx="256" cy="336" r="6.2" class="nc"/>
    <circle cx="256" cy="176" r="10.5" fill="#FFFFFF" opacity=".22"/>
    <circle cx="256" cy="256" r="13.5" fill="#FFFFFF" opacity=".24"/>
    <circle cx="256" cy="336" r="10.5" fill="#FFFFFF" opacity=".22"/>
  </g>
</svg>
